# .github/workflows/validate.yml
name: Validate Environment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=server --cov-report=xml
    
    - name: Start server
      run: |
        uvicorn server.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
    
    - name: Test API endpoints
      run: |
        curl -f http://localhost:8000/health
        curl -f -X POST http://localhost:8000/reset \
          -H "Content-Type: application/json" \
          -d '{"task_name": "easy_categorization"}'
        curl -f http://localhost:8000/state
    
  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: docker build -t email-triage-assistant .
    
    - name: Run Docker container
      run: |
        docker run -d -p 8000:8000 --name test-env email-triage-assistant
        sleep 5
    
    - name: Test Docker container
      run: |
        curl -f http://localhost:8000/health
        docker stop test-env